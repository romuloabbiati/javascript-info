<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Your HTML Page</title>
    <script>
      function filterRangeInPlace(arr, a, b) {

        for (let i = 0; i < arr.length; i++) {
          let val = arr[i];

          if (val < a || val > b) {
            arr.splice(i, 1);
            i--;
          }
        }
        
      }

      let arr = [5, 3, 8, 1];

      filterRangeInPlace(arr, 1, 4);

      alert( arr );
    </script>
  </head>
